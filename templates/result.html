<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>結果 | LUCKY MIRROR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    async function submitSurvey(e){
      e.preventDefault();
      const form = document.getElementById("survey-form");
      const fd = new FormData(form);
      const res = await fetch("{{ url_for('survey') }}", {method:"POST", body: fd});
      const j = await res.json();
      const msg = document.getElementById("thankyou");
      if(j.ok){ msg.style.display = "block"; }
    }
  </script>
</head>
<body>
  <div class="container">
    <h1>占い結果</h1>
    <div class="card">
      <p class="meta">カテゴリ：{{category}} ／ 誕生月：{{month}}月 ／ 血液型：{{blood}}型</p>
      <p class="message">{{message}}</p>
      <div class="gauge">
        <div class="gauge-label">今日のポジティブ指数</div>
        <div class="gauge-bar">
          <span style="width: {{positive_index}}%"></span>
        </div>
        <div class="gauge-value">{{positive_index}}%</div>
      </div>
    </div>


    <div id="history" class="card"></div>

    <div class="card">
      <h2>アンケート（5段階）</h2>
      <form id="survey-form" action="https://script.google.com/macros/s/AKfycbwDPVYo3uopegbt9PMf8ogLeEwjM4lsqMl9f9I7WVRE_f6gZ0jqvrMIp-XEORmUbMSaBQ/exec">
        <input type="hidden" name="category" value="{{category}}"/>
        <input type="hidden" name="month" value="{{month}}"/>
        <input type="hidden" name="blood" value="{{blood}}"/>
        <input type="hidden" name="positive_index" value="{{positive_index}}"/>
        <div class="row">
          <label>スッキリ度
            <select name="sukkiri" required>
              <option value="" disabled selected>選択してください</option>

              

            <option value="1">とてもスッキリ</option>
              <option value="2">ややスッキリ</option>
              <option value="3">普通</option>
              <option value="4">あまりスッキリしなかった</option>
              <option value="5">全然スッキリしなかった</option>

            </select>
          </label>
          <label>満足度
            <select name="satisfaction" required>
              <option value="" disabled selected>選択してください</option>

             
              <option value="1">とても満足</option>
              <option value="2">やや満足</option>
              <option value="3">普通</option>
              <option value="4">あまり満足せず</option>
              <option value="5">満足せず</option>

            </select>
          </label>
        </div>
        <div class="actions">
          <button type="submit">送信する</button>
        </div>
        <p id="thankyou" style="display:none;margin-top:8px;">ご協力ありがとうございます！結果は研究データとして匿名で活用します。</p>
      </form>
    </div>

    <div class="actions">
      <a class="link" href="{{ url_for('index') }}">もう一度占う</a>
    </div>
  </div>

　 <script>
    document.addEventListener("DOMContentLoaded", () => {
      const username = "{{ username }}"; 
      const message = {{ message|tojson }};
      const positiveIndex = {{ positive_index }};
      const date = new Date().toLocaleString();

      if (username) {
        const resultData = {
          date: date,
          message: message,
          positiveIndex: positiveIndex
        };

        // 既存データがあれば取り出して配列に
        const userHistory = JSON.parse(localStorage.getItem(username)) || [];
        userHistory.push(resultData);

        // 保存
        localStorage.setItem(username, JSON.stringify(userHistory));

        // 履歴表示
        const historyDiv = document.getElementById("history");
        if (userHistory.length > 1) {
          const prev = userHistory[userHistory.length - 2];
          const curr = userHistory[userHistory.length - 1];
          const diff = curr.positiveIndex - prev.positiveIndex;
          const arrow = diff > 0 ? "上昇↑✨" : diff < 0 ? "下降↓💭" : "変化なし🌿";
          historyDiv.innerHTML = `
            <h2>${username}さんのこれまでの運勢</h2>
            <p>前回（${prev.date}）：${prev.positiveIndex}%</p>
            <p>今回（${curr.date}）：${curr.positiveIndex}%</p>
            <p>→ ${arrow}</p>
          `;
        } else {
          historyDiv.innerHTML = `<p>初回の占い結果です🌸</p>`;
        }
      }
    });
  </script>


</body>
</html>
