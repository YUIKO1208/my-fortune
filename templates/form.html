<form id="moodForm">
  <label>ユーザー名: <input type="text" name="username" required></label><br><br>
  <label>ポジティブ指数 (0〜100): <input type="number" name="positive_index" min="0" max="100" required></label><br><br>
  <label>スッキリ度 (0〜100): <input type="number" name="clear_index" min="0" max="100" required></label><br><br>
  <label>満足度 (0〜100): <input type="number" name="satisfaction" min="0" max="100" required></label><br><br>
  <button type="submit">送信</button>
</form>

<p id="result"></p>

<script>
document.getElementById("moodForm").addEventListener("submit", async function(event) {
  event.preventDefault(); // ページ遷移を防ぐ

  const form = event.target;
  const formData = new FormData(form);

  const response = await fetch("https://script.google.com/macros/s/AKfycbwDPVYo3uopegbt9PMf8ogLeEwjM4lsqMl9f9I7WVRE_f6gZ0jqvrMIp-XEORmUbMSaBQ/exec", {
    method: "POST",
    body: formData,
    mode: "no-cors" // ← これが重要！CORSエラーを防ぐ
  });

  document.getElementById("result").textContent = "送信しました！";
  form.reset();
});
</script>
